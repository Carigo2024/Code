<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acuracidade do Forecast de Importacao (UPI)</title>
<style>
  :root{
    --brand:#d9601c; --f:#1b9e77; --a:#e2611c; --over:#e34948; --under:#5a6b7a;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --line:#e7e6e2;
    --surface:#ffffff; --panel:#fbf7f3; --chip:#f3ebe4;
    --good:#1baf7a; --warn:#eda100;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:#f2f1ee;font-size:14px;line-height:1.45}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:16px}
  header h1{margin:0;font-size:18px}
  header .meta{color:var(--ink2);font-size:12px;margin-top:3px}
  .ctrl{background:#fff;border-bottom:1px solid var(--line);padding:8px 22px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:6}
  .ctrl select{border-color:var(--brand);font-weight:600;color:var(--brand)}
  .wrap{display:flex;min-height:100vh}
  nav{width:210px;background:var(--surface);border-right:1px solid var(--line);padding:10px 0;flex-shrink:0}
  nav a{display:block;padding:10px 20px;color:var(--ink2);cursor:pointer;font-weight:600;border-left:3px solid transparent}
  nav a:hover{background:var(--panel)}
  nav a.active{color:var(--brand);border-left-color:var(--brand);background:var(--panel)}
  main{flex:1;padding:20px 26px;max-width:1180px}
  h2{font-size:16px;margin:0 0 4px}
  .sub{color:var(--ink2);font-size:12.5px;margin-bottom:16px}
  section{display:none}
  section.on{display:block}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:150px;flex:1}
  .card .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  .card .val{font-size:24px;font-weight:700;margin-top:4px}
  .card .val.pos{color:var(--over)} .card .val.neg{color:var(--under)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
  .panel h3{margin:0 0 10px;font-size:14px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{background:var(--panel);color:var(--ink2);font-weight:600;cursor:pointer;position:sticky;top:0}
  td.l,th.l{text-align:left}
  .scroll{overflow:auto;max-height:70vh}
  .chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--chip);color:var(--ink2)}
  .b-abcA{background:#d8ebe0;color:#0f7a52}.b-abcB{background:#fdf0d0;color:#8a6400}.b-abcC{background:#eee;color:#666}
  .cl{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .cl-vies_sub{background:#e34948}.cl-vies_super{background:#eda100}.cl-timing{background:#5a6b7a}
  .cl-erratico{background:#7a4fb0}.cl-sob_controle{background:#1baf7a}.cl-nao_previsto{background:#8a8984}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
  select,input,button{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  button{cursor:pointer;background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  button.ghost{background:#fff;color:var(--ink2)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin:4px 0 8px}
  .legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .matrix td,.matrix th{text-align:center;font-size:11.5px;padding:5px 7px}
  .matrix .realizado{font-weight:700}
  .note{font-size:12px;color:var(--ink2);background:var(--panel);border-left:3px solid var(--brand);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}nav{width:150px}}
  .arrow{font-size:20px;font-weight:700}
  .muted{color:var(--muted)}
  .r{ text-align:right} .small{font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<header>
  <img id="logo" alt="" style="height:40px;width:auto;display:none;flex-shrink:0">
  <div>
    <h1 id="h1"></h1>
    <div class="meta" id="meta"></div>
  </div>
</header>
<div class="ctrl">
  <span class="small" style="font-weight:600" id="lagsel-label"></span>
  <select id="lagsel"></select>
  <span id="lagnote" class="small muted"></span>
  <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span class="small" style="font-weight:600" id="langsel-label"></span>
    <select id="langsel">
      <option value="pt">Português</option>
      <option value="en">English</option>
    </select>
  </span>
</div>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <section id="visao" class="on"></section>
    <section id="rankings"></section>
    <section id="ficha"></section>
    <section id="mestre"></section>
    <section id="lag"></section>
    <section id="estab"></section>
    <section id="excec"></section>
  </main>
</div>

const M=DATA.meta, DIM=DATA.itemdim;

const isCons = ()=>CUR==='cons';

  // MESTRE

          vol_recv:'Vol receb',F_lag:'Prev',A:'Receb',bias:'Bias',wape_acum:'WAPE ac',acuracia:'Acur',

  x_sub:cur=>`Órfãos, tracking signal fora de controle (leitura ${cur}) e itens novos/descontinuados.`,
  x_prev_nr:'Previsto e não recebido (UPI)', x_recv_np:'Recebido sem previsão',
  x_new:'Itens novos (entraram no ano)', x_disc:'Itens descontinuados (saíram)',
  x_ts:n=>`Tracking signal fora de controle |TS|>4 (${n})`,
  x_th_item:'Item', x_th_desc:'Descrição', x_th_ts:'TS', x_th_bias:'Bias', x_th_classe:'Classe',
 },
 en:{
  loc:'en-US', dsep:'.', lang_label:'Language:',
  title:'Import Forecast Accuracy (UPI)',
  h1:'Import Forecast Accuracy · UPI (intercompany)',
  meta:(esc,n,off,mp)=>`Scope: supplier ${esc} · ${n} comparable items · physical lag +${off} month · partial month ${mp} excluded from calculations`,
  lag_label:'Reading (lag):',
  lagnote_win:'window: ',
  lagnote_cons:' · optimistic (uses the latest vintage)',
  lagnote_zero:' · same month (diagnostic)',
  lagnote_honesto:' · honest reading',
  lag_opt_honesto:L=>`Lag ${L} · honest (purchase decision)`,
  lag_opt_zero:'Lag 0 · same month',
  lag_opt_normal:L=>`Lag ${L}`,
  lag_opt_cons:'Consolidated · latest vintage (optimistic)',
  modo_cons:'consolidated (latest vintage — optimistic)',
  modo_zero:'lag 0 (same month — diagnostic)',
  modo_honesto:c=>`lag ${c} (honest)`,
  modo_normal:c=>`lag ${c}`,
  tabs:['Overview','Biggest variances','Item sheet','Master table','Accuracy by lag','Stability','Exceptions'],
  // VISAO
  v_sub:(modo,meses)=>`Reading ${modo} · window ${meses}. Actual = UPI physical entry (Qty Delivered).`,
  v_card_acc:'Accuracy (1−cum. WAPE)', v_card_bias:'Volume bias',
  v_card_wacum:'Cum. WAPE (volume)', v_card_wmes:'Monthly WAPE (with timing)',
  v_dica_cons:lag=>`<b>Caution:</b> the consolidated reading uses the most recent forecast — information you did not have at purchase time. It flattens the error (optimistic). To hold accuracy accountable, use lag ${lag}.`,
  v_dica_zero:lag=>`<b>Diagnostic:</b> lag 0 is the forecast made in the target month itself — the purchase was already locked ~${lag} months earlier. Useful to see how much the forecast improves near the target, but it is not the one that drove the purchase.`,
  v_dica_honesto:(lag,off)=>`The honest reading is <b>lag ${lag}</b> (the forecast that locked the purchase ~${lag} months earlier). The volume figure is the <b>cumulative WAPE</b>; the monthly WAPE is inflated by arrival timing (+${off} month).`,
  v_chart:'Forecast vs Received by month (units)',
  leg_prev:(cons,cur)=>`Forecast (${cons?'consolidated':'lag '+cur})`,
  leg_receb:'Received', leg_err:'label = month error %',
  // RANKINGS
  r_sub:cur=>`Top 15 by absolute variance (units) and by % variance (floor: A+B classes). Current reading: ${cur}.`,
  r_th_item:'Item', r_th_desc:'Description', r_th_abc:'ABC',
  r_th_erro:'Error (u)', r_th_bias:'Bias %', r_th_prev:'Fcst', r_th_receb:'Recv',
  r_b_abs_over:'ABSOLUTE variance — over-forecast (fcst > recv)',
  r_b_abs_under:'ABSOLUTE variance — under-forecast (recv > fcst)',
  r_b_pct_over:'% variance — over-forecast (A+B)',
  r_b_pct_under:'% variance — under-forecast (A+B)',
  // FICHA
  f_sub:'Select any comparable item (UPI). Metrics use the current reading; the matrix and accuracy-by-lag show all lags.',
  f_item:'Item:', f_abc:abc=>`ABC ${abc}`,
  f_dims:(fam,marca,um,st,ch)=>`Family: ${fam} · Brand: ${marca} · UoM: ${um} · Status: ${st} · Churn: ${ch}`,
  f_no_metric:cur=>`This item has no forecast in this reading (${cur}). See the matrix below or change the lag.`,
  f_c_prev:'Forecast', f_c_receb:'Received', f_c_bias:'Bias', f_c_wacum:'Cum. WAPE',
  f_c_acc:'Accuracy', f_c_ts:'Tracking signal',
  f_pattern:(cur,lab,acao)=>`<b>Pattern (${cur}):</b> ${lab}. <b>Action:</b> ${acao}`,
  f_chart:(cons,cur)=>`Forecast (${cons?'consolidated':'lag '+cur}) vs Received — month by month`,
  f_mtx_corner:'Vintage ╲ Target', f_realizado:'Actual',
  f_mtx_title:'Vintage × Target-month matrix (forecast) + Actual',

  f_lagacc:'Accuracy by lag for this item (cum. WAPE %)',
  // MESTRE
  m_h2:'Item master table',

  m_cols:{item:'Item',desc:'Description',familia:'Family',abc:'ABC',status:'Status',classe:'Pattern',
          vol_recv:'Vol recv',F_lag:'Fcst',A:'Recv',bias:'Bias',wape_acum:'Cum WAPE',acuracia:'Acc',
          tracking_signal:'TS',churn:'Churn'},
  m_fam_all:'Family: all', m_abc_all:'ABC: all', m_cl_all:'Pattern: all',
  m_search:'search item/description', m_export:'Export CSV', m_count:n=>`${n} items`,
  // LAG
  l_h2:'Accuracy by lag (horizon)',
  l_sub:'From how far ahead the forecast is reliable — each lag on its window of closed months. (Compares all lags; independent of the selector above.)',
  l_wape:'WAPE by lag', l_leg_mes:'Monthly WAPE', l_leg_acum:'Cum. WAPE (volume)',
  l_th_lag:'Lag', l_th_win:'Window', l_th_bias:'Bias', l_th_wmes:'Monthly WAPE', l_th_wacum:'Cum. WAPE',
  l_detalhe:'Detail',
  // ESTAB
  e_h2:'Forecast stability (churn)',
  e_sub:'How much the forecast for the same target month varied across successive vintages. High churn = unstable planning for the matrix.',
  e_avg:'Average churn', e_top:'Top 20 items by churn',
  // EXCEC
  x_sub:cur=>`Orphans, out-of-control tracking signal (reading ${cur}) and new/discontinued items.`,
  x_prev_nr:'Forecast and not received (UPI)', x_recv_np:'Received without forecast',
  x_new:'New items (entered this year)', x_disc:'Discontinued items (left)',
  x_ts:n=>`Out-of-control tracking signal |TS|>4 (${n})`,
  x_th_item:'Item', x_th_desc:'Description', x_th_ts:'TS', x_th_bias:'Bias', x_th_classe:'Class',
 }
};
// classes: rotulo + acao derivados do CODIGO (classe), nao do texto que veio do Python
const CLASSE_I18N={
 pt:{
  sob_controle:{l:'Sob controle',a:'Nenhuma — dentro da tolerância.'},
  vies_super:{l:'Viés superprevisão',a:'Superprevisão crônica: corrigir método/premissa; revisar estoque (capital parado).'},
  vies_sub:{l:'Viés subprevisão',a:'Subprevisão crônica: revisar premissa e estoque de segurança (risco de ruptura).'},
  timing:{l:'Erro de timing',a:'Volume bate, meses não: tratar com lead time (+1 mês) e bucket, não mudar a previsão.'},
  erratico:{l:'Errático',a:'Alta dispersão sem viés: cobrir com estoque de segurança, não adianta prever melhor.'},
  nao_previsto:{l:'Não previsto',a:'Recebido sem previsão na janela: incluir no forecast da matriz.'},
 },
 en:{
  sob_controle:{l:'Under control',a:'None — within tolerance.'},
  vies_super:{l:'Over-forecast bias',a:'Chronic over-forecast: fix method/assumption; review stock (tied-up capital).'},
  vies_sub:{l:'Under-forecast bias',a:'Chronic under-forecast: review assumption and safety stock (stockout risk).'},
  timing:{l:'Timing error',a:"Volume matches, months don't: treat with lead time (+1 month) and buckets, don't change the forecast."},
  erratico:{l:'Erratic',a:"High dispersion without bias: cover with safety stock; forecasting better won't help."},
  nao_previsto:{l:'Not forecast',a:'Received without forecast in the window: add it to the matrix forecast.'},
 }
};
const STATUS_I18N={
 pt:{novo:'novo',descontinuado:'descontinuado',ativo:'ativo',sem_forecast:'sem forecast'},
 en:{novo:'new',descontinuado:'discontinued',ativo:'active',sem_forecast:'no forecast'}
};
let L = (function(){try{const s=localStorage.getItem('fc_lang');return (s==='en'||s==='pt')?s:'pt';}catch(e){return 'pt';}})();
let T = I18N[L];
let LOCALE = T.loc, DSEP = T.dsep;
const clLabel=code=>((CLASSE_I18N[L]||CLASSE_I18N.pt)[code]||{l:code}).l;
const clAcao =code=>((CLASSE_I18N[L]||CLASSE_I18N.pt)[code]||{a:''}).a;
const stLabel=s=>((STATUS_I18N[L]||STATUS_I18N.pt)[s]||s||'');

// ---------- helpers ----------
const $=(s,r=document)=>r.querySelector(s), el=(t,a={},...k)=>{const e=document.createElement(t);
  for(const[p,v]of Object.entries(a)){if(p==='class')e.className=v;else if(p==='html')e.innerHTML=v;else e.setAttribute(p,v);}
  k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?'':c)));return e;};
const fmt=n=>n==null?'–':Math.round(n).toLocaleString(LOCALE);
const fmtK=n=>{n=n||0;const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace('.',DSEP)+'M':a>=1e3?(n/1e3).toFixed(0)+'k':Math.round(n).toString();};
const pct=n=>n==null?'–':(n*100).toFixed(1).replace('.',DSEP)+'%';
const pctS=n=>n==null?'–':(n*100>=0?'+':'')+(n*100).toFixed(1).replace('.',DSEP)+'%';
const CF='#1b9e77',CA='#e2611c',COVER='#e34948',CUND='#5a6b7a',BRAND='#d9601c';
const mkey=l=>{const p=l.split('-');return (+p[0])*12+(+p[1]-1);};
const mlabel=k=>String(Math.floor(k/12)).padStart(4,'0')+'-'+String(k%12+1).padStart(2,'0');
function barGroup(labels,series,{h=220,fmtY=fmtK,labelErr=null}={}){
  const w=Math.max(360,labels.length*80), pad=48, iw=w-pad-14, ih=h-30;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>v||0)));
  const bw=iw/labels.length, gw=bw*0.62/series.length;
  let g=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  for(let i=0;i<=4;i++){const y=10+ih*(1-i/4);g+=`<line x1="${pad}" x2="${w-4}" y1="${y}" y2="${y}" stroke="#e7e6e2"/>`+
    `<text x="${pad-6}" y="${y+3}" font-size="9" fill="#8a8984" text-anchor="end">${fmtY(max*i/4)}</text>`;}
  labels.forEach((lb,xi)=>{const x0=pad+bw*xi+bw*0.19;
    series.forEach((s,si)=>{const v=s.values[xi]||0,bh=ih*v/max,x=x0+gw*si;
      g+=`<rect x="${x}" y="${10+ih-bh}" width="${gw*0.9}" height="${bh}" fill="${s.color}" rx="2"/>`;});
    g+=`<text x="${pad+bw*xi+bw/2}" y="${h-4}" font-size="10" fill="#52514e" text-anchor="middle">${lb}</text>`;
    if(labelErr&&labelErr[xi]!=null){const top=10+ih-ih*Math.max(...series.map(s=>s.values[xi]||0))/max;
      g+=`<text x="${pad+bw*xi+bw/2}" y="${top-4}" font-size="9.5" font-weight="700" fill="${labelErr[xi]>=0?COVER:CUND}" text-anchor="middle">${(labelErr[xi]>=0?'+':'')+labelErr[xi].toFixed(0)}%</text>`;}
  });
  return g+'</svg>';
}
function hbars(rows,{color=(r=>BRAND),fmtV=fmt}={}){
  const m=Math.max(1,...rows.map(r=>Math.abs(r.v)));
  return `<div>`+rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0">
    <div style="width:150px" class="small" title="${r.label}">${r.label.length>26?r.label.slice(0,25)+'…':r.label}</div>
    <div style="flex:1;background:#f0efec;border-radius:4px"><div style="width:${Math.abs(r.v)/m*100}%;background:${color(r)};height:14px;border-radius:4px"></div></div>
    <div style="width:74px;text-align:right" class="small"><b>${fmtV(r.v)}</b></div></div>`).join('')+`</div>`;
}

function modoLabel(){ if(isCons())return T.modo_cons; if(CUR==='0')return T.modo_zero;

// ---------- FICHA DO ITEM ----------
let fichaItem=null;
function fichaSeries(item){const mtz=DATA.detalhe[item].matriz,win=V().window,out={meses:[],F:[],A:[]};
  win.forEach(t=>{const tj=mtz.targets.indexOf(t);if(tj<0)return;let F=null;
    if(isCons()){for(let vi=mtz.vintages.length-1;vi>=0;vi--){if(mtz.matrix[vi][tj]!=null){F=mtz.matrix[vi][tj];break;}}}
    else{const sa=mlabel(mkey(t)-(+CUR));const vi=mtz.vintages.indexOf(sa);F=vi>=0?mtz.matrix[vi][tj]:null;}
    out.meses.push(t);out.F.push(F||0);out.A.push(mtz.actual[tj]||0);});
  return out;}
function renderFicha(){const s=$('#ficha');s.innerHTML='';
  s.append(el('h2',{},T.tabs[2]),el('div',{class:'sub'},T.f_sub));
  const sorted=Object.keys(DIM).sort((a,b)=>(DIM[b].vol_recv||0)-(DIM[a].vol_recv||0));
  if(!fichaItem||!DIM[fichaItem])fichaItem=sorted[0];
  const sel=el('select',{style:'min-width:340px'});
  sorted.forEach(it=>sel.append(el('option',{value:it},`${it} · ${(DIM[it].desc||'').slice(0,34)} [${DIM[it].abc}]`)));
  sel.value=fichaItem;sel.onchange=()=>{fichaItem=sel.value;renderFicha();};
  const box=el('div');
  s.append(el('div',{class:'filters'},el('span',{class:'small'},T.f_item),sel),box);
  const it=fichaItem,d=DIM[it],m=metricOf(it),det=DATA.detalhe[it];
  box.append(el('div',{class:'panel'},
    el('h3',{html:`${it} — ${d.desc||''} <span class="chip b-abc${d.abc}">${T.f_abc(d.abc)}</span>${m?` <span class="cl cl-${m.classe}">${clLabel(m.classe)}</span>`:''}`}),
    el('div',{class:'small'},T.f_dims(d.familia||'–',d.marca||'–',d.um||'–',stLabel(d.status),pct(d.churn)))));
  if(!m){box.append(el('div',{class:'note',html:T.f_no_metric(curReading())}));}
  else{const cards=el('div',{class:'cards'});
    const mk=(l,v,cls='')=>el('div',{class:'card'},el('div',{class:'lbl'},l),el('div',{class:'val '+cls},v));
    cards.append(mk(T.f_c_prev,fmt(m.F_lag)),mk(T.f_c_receb,fmt(m.A)),mk(T.f_c_bias,pctS(m.bias),m.bias>=0?'pos':'neg'),
      mk(T.f_c_wacum,pct(m.wape_acum)),mk(T.f_c_acc,pct(m.acuracia)),mk(T.f_c_ts,m.tracking_signal));
    box.append(cards);
    box.append(el('div',{class:'note',html:T.f_pattern(curReading(),clLabel(m.classe),clAcao(m.classe))}));
    const ser=fichaSeries(it);
    box.append(el('div',{class:'panel'},el('h3',{},T.f_chart(isCons(),CUR)),
      el('div',{class:'legend',html:`<span><b style="background:${CF}"></b>${T.f_c_prev}</span><span><b style="background:${CA}"></b>${T.f_c_receb}</span>`}),
      el('div',{html:barGroup(ser.meses,[{name:'P',color:CF,values:ser.F},{name:'R',color:CA,values:ser.A}],
        {labelErr:ser.F.map((f,i)=>f?((ser.A[i]-f)/f*100):null)})})));
  }
  // matriz safra x alvo (todos os lags)
  const mtz=det.matriz,mt=el('table',{class:'matrix'});
  mt.append(el('tr',{},el('th',{class:'l'},T.f_mtx_corner),...mtz.targets.map(t=>el('th',{},t))));
  const allv=mtz.matrix.flat().filter(x=>x!=null);const vmax=Math.max(1,...allv);
  mtz.vintages.forEach((v,vi)=>{const tr=el('tr',{},el('th',{class:'l'},v));
    mtz.matrix[vi].forEach(val=>{const bg=val==null?'#fff':`rgba(27,158,119,${0.08+0.5*val/vmax})`;
      tr.append(el('td',{style:`background:${bg}`},val==null?'':fmt(val)));});mt.append(tr);});
  const trR=el('tr',{class:'realizado'},el('th',{class:'l'},T.f_realizado));
  mtz.actual.forEach(val=>trR.append(el('td',{style:'background:#fdece4'},val==null?'':fmt(val))));mt.append(trR);
  box.append(el('div',{class:'panel'},el('h3',{},T.f_mtx_title),
    el('div',{class:'small'},T.f_mtx_help),
    el('div',{class:'scroll'},mt)));
  if(det.lag_acc.length){const rows=det.lag_acc.map(x=>({label:'lag '+x.lag,v:x.wape_acum==null?0:x.wape_acum*100}));
    box.append(el('div',{class:'panel'},el('h3',{},T.f_lagacc),
      el('div',{html:hbars(rows,{fmtV:v=>v.toFixed(0)+'%',color:r=>r.v>40?COVER:BRAND})})));}
}

// ---------- TABELA MESTRE ----------
let sortk='vol_recv',asc=false;
function renderMestre(){const s=$('#mestre');s.innerHTML='';
  s.append(el('h2',{},T.m_h2),el('div',{class:'sub'},T.m_sub(curReading())));
  const cols=[['item','l'],['desc','l'],['familia','l'],['abc',''],
    ['status','l'],['classe','l'],['vol_recv',''],['F_lag',''],
    ['A',''],['bias',''],['wape_acum',''],['acuracia',''],
    ['tracking_signal',''],['churn','']];
  const clab=k=>T.m_cols[k]||k;
  const base=rowsMestre();
  const fFam=el('select',{},el('option',{value:''},T.m_fam_all));
  [...new Set(base.map(r=>r.familia).filter(Boolean))].sort().forEach(f=>fFam.append(el('option',{value:f},f)));
  const fAbc=el('select',{},el('option',{value:''},T.m_abc_all),...['A','B','C'].map(x=>el('option',{value:x},'ABC '+x)));
  const fCl=el('select',{},el('option',{value:''},T.m_cl_all));
  [...new Set(base.map(r=>r.classe))].forEach(c=>fCl.append(el('option',{value:c},clLabel(c))));
  const q=el('input',{placeholder:T.m_search,style:'min-width:200px'});
  const exp=el('button',{},T.m_export);const host=el('div',{class:'scroll'});const cnt=el('span',{class:'small muted'});
  let view=[];
  function apply(){view=base.filter(r=>
    (!fFam.value||r.familia===fFam.value)&&(!fAbc.value||r.abc===fAbc.value)&&
    (!fCl.value||r.classe===fCl.value)&&
    (!q.value||(r.item+' '+(r.desc||'')).toLowerCase().includes(q.value.toLowerCase())));
    view.sort((a,b)=>{let x=a[sortk],y=b[sortk];x=x==null?-1e18:x;y=y==null?-1e18:y;
      if(typeof x==='string')return asc?(''+x).localeCompare(y):(''+y).localeCompare(x);return asc?x-y:y-x;});
    const t=el('table');const hr=el('tr');
    cols.forEach(([k,cl])=>{const th=el('th',{class:cl},clab(k)+(sortk===k?(asc?' ▲':' ▼'):''));th.onclick=()=>{if(sortk===k)asc=!asc;else{sortk=k;asc=false;}apply();};hr.append(th);});
    t.append(hr);
    view.forEach(r=>{t.append(el('tr',{},
      el('td',{class:'l'},r.item),el('td',{class:'l',title:r.desc},(r.desc||'').slice(0,30)),
      el('td',{class:'l'},r.familia||''),el('td',{},el('span',{class:'chip b-abc'+r.abc},r.abc)),
      el('td',{class:'l'},stLabel(r.status)),el('td',{class:'l'},el('span',{class:'cl cl-'+r.classe},clLabel(r.classe))),
      el('td',{},fmt(r.vol_recv)),el('td',{},fmt(r.F_lag)),el('td',{},fmt(r.A)),
      el('td',{},pctS(r.bias)),el('td',{},pct(r.wape_acum)),el('td',{},pct(r.acuracia)),
      el('td',{},r.tracking_signal),el('td',{},pct(r.churn))));});
    host.innerHTML='';host.append(t);cnt.textContent=T.m_count(view.length);}
  [fFam,fAbc,fCl].forEach(x=>x.onchange=apply);q.oninput=apply;
  exp.onclick=()=>{const head=cols.map(([k])=>clab(k)).join(';');
    const cell=(r,k)=>{let v=(k==='classe')?clLabel(r.classe):(k==='status')?stLabel(r.status):r[k];return v==null?'':(''+v).replace(';',',');};
    const body=view.map(r=>cols.map(([k])=>cell(r,k)).join(';')).join('\n');
    const blob=new Blob([head+'\n'+body],{type:'text/csv'});const u=URL.createObjectURL(blob);
    const link=el('a',{href:u,download:'mestre_itens_lag_'+CUR+'.csv'});link.click();URL.revokeObjectURL(u);};
  s.append(el('div',{class:'filters'},q,fFam,fAbc,fCl,exp,cnt),host);apply();
}
