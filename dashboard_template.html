<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acuracidade do Forecast de Importacao (UPI)</title>
<style>
  :root{
    --brand:#d9601c; --f:#1b9e77; --a:#e2611c; --over:#e34948; --under:#5a6b7a;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --line:#e7e6e2;
    --surface:#ffffff; --panel:#fbf7f3; --chip:#f3ebe4;
    --good:#1baf7a; --warn:#eda100;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:#f2f1ee;font-size:14px;line-height:1.45}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:16px}
  header h1{margin:0;font-size:18px}
  header .meta{color:var(--ink2);font-size:12px;margin-top:3px}
  .ctrl{background:#fff;border-bottom:1px solid var(--line);padding:8px 22px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:6}
  .ctrl select{border-color:var(--brand);font-weight:600;color:var(--brand)}
  .wrap{display:flex;min-height:100vh}
  nav{width:210px;background:var(--surface);border-right:1px solid var(--line);padding:10px 0;flex-shrink:0}
  nav a{display:block;padding:10px 20px;color:var(--ink2);cursor:pointer;font-weight:600;border-left:3px solid transparent}
  nav a:hover{background:var(--panel)}
  nav a.active{color:var(--brand);border-left-color:var(--brand);background:var(--panel)}
  main{flex:1;padding:20px 26px;max-width:1180px}
  h2{font-size:16px;margin:0 0 4px}
  .sub{color:var(--ink2);font-size:12.5px;margin-bottom:16px}
  section{display:none}
  section.on{display:block}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:150px;flex:1}
  .card .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  .card .val{font-size:24px;font-weight:700;margin-top:4px}
  .card .val.pos{color:var(--over)} .card .val.neg{color:var(--under)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
  .panel h3{margin:0 0 10px;font-size:14px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{background:var(--panel);color:var(--ink2);font-weight:600;cursor:pointer;position:sticky;top:0}
  td.l,th.l{text-align:left}
  .scroll{overflow:auto;max-height:70vh}
  .chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--chip);color:var(--ink2)}
  .b-abcA{background:#d8ebe0;color:#0f7a52}.b-abcB{background:#fdf0d0;color:#8a6400}.b-abcC{background:#eee;color:#666}
  .cl{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .cl-vies_sub{background:#e34948}.cl-vies_super{background:#eda100}.cl-timing{background:#5a6b7a}
  .cl-erratico{background:#7a4fb0}.cl-sob_controle{background:#1baf7a}.cl-nao_previsto{background:#8a8984}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
  select,input,button{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  button{cursor:pointer;background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  button.ghost{background:#fff;color:var(--ink2)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin:4px 0 8px}
  .legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .matrix td,.matrix th{text-align:center;font-size:11.5px;padding:5px 7px}
  .matrix .realizado{font-weight:700}
  .note{font-size:12px;color:var(--ink2);background:var(--panel);border-left:3px solid var(--brand);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}nav{width:150px}}
  .arrow{font-size:20px;font-weight:700}
  .muted{color:var(--muted)}
  .r{ text-align:right} .small{font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<header>
  <img id="logo" alt="" style="height:40px;width:auto;display:none;flex-shrink:0">
  <div>
    <h1>Acuracidade do Forecast de Importacao &middot; UPI (intercompany)</h1>
    <div class="meta" id="meta"></div>
  </div>
</header>
<div class="ctrl">
  <span class="small" style="font-weight:600">Leitura (lag):</span>
  <select id="lagsel"></select>
  <span id="lagnote" class="small muted"></span>
</div>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <section id="visao" class="on"></section>
    <section id="rankings"></section>
    <section id="ficha"></section>
    <section id="mestre"></section>
    <section id="lag"></section>
    <section id="estab"></section>
    <section id="excec"></section>
  </main>
</div>
<script>
const DATA = /*__DATA__*/;
const M=DATA.meta, DIM=DATA.itemdim;
let CUR = M.lag_default;
const V = ()=>DATA.views[CUR];
const isCons = ()=>CUR==='cons';
// ---------- helpers ----------
const $=(s,r=document)=>r.querySelector(s), el=(t,a={},...k)=>{const e=document.createElement(t);
  for(const[p,v]of Object.entries(a)){if(p==='class')e.className=v;else if(p==='html')e.innerHTML=v;else e.setAttribute(p,v);}
  k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?'':c)));return e;};
const fmt=n=>n==null?'–':Math.round(n).toLocaleString('pt-BR');
const fmtK=n=>{n=n||0;const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace('.',',')+'M':a>=1e3?(n/1e3).toFixed(0)+'k':Math.round(n).toString();};
const pct=n=>n==null?'–':(n*100).toFixed(1)+'%';
const pctS=n=>n==null?'–':(n*100>=0?'+':'')+(n*100).toFixed(1)+'%';
const CF='#1b9e77',CA='#e2611c',COVER='#e34948',CUND='#5a6b7a',BRAND='#d9601c';
const mkey=l=>{const p=l.split('-');return (+p[0])*12+(+p[1]-1);};
const mlabel=k=>String(Math.floor(k/12)).padStart(4,'0')+'-'+String(k%12+1).padStart(2,'0');
function barGroup(labels,series,{h=220,fmtY=fmtK,labelErr=null}={}){
  const w=Math.max(360,labels.length*80), pad=48, iw=w-pad-14, ih=h-30;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>v||0)));
  const bw=iw/labels.length, gw=bw*0.62/series.length;
  let g=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  for(let i=0;i<=4;i++){const y=10+ih*(1-i/4);g+=`<line x1="${pad}" x2="${w-4}" y1="${y}" y2="${y}" stroke="#e7e6e2"/>`+
    `<text x="${pad-6}" y="${y+3}" font-size="9" fill="#8a8984" text-anchor="end">${fmtY(max*i/4)}</text>`;}
  labels.forEach((lb,xi)=>{const x0=pad+bw*xi+bw*0.19;
    series.forEach((s,si)=>{const v=s.values[xi]||0,bh=ih*v/max,x=x0+gw*si;
      g+=`<rect x="${x}" y="${10+ih-bh}" width="${gw*0.9}" height="${bh}" fill="${s.color}" rx="2"/>`;});
    g+=`<text x="${pad+bw*xi+bw/2}" y="${h-4}" font-size="10" fill="#52514e" text-anchor="middle">${lb}</text>`;
    if(labelErr&&labelErr[xi]!=null){const top=10+ih-ih*Math.max(...series.map(s=>s.values[xi]||0))/max;
      g+=`<text x="${pad+bw*xi+bw/2}" y="${top-4}" font-size="9.5" font-weight="700" fill="${labelErr[xi]>=0?COVER:CUND}" text-anchor="middle">${(labelErr[xi]>=0?'+':'')+labelErr[xi].toFixed(0)}%</text>`;}
  });
  return g+'</svg>';
}
function hbars(rows,{color=(r=>BRAND),fmtV=fmt}={}){
  const m=Math.max(1,...rows.map(r=>Math.abs(r.v)));
  return `<div>`+rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0">
    <div style="width:150px" class="small" title="${r.label}">${r.label.length>26?r.label.slice(0,25)+'…':r.label}</div>
    <div style="flex:1;background:#f0efec;border-radius:4px"><div style="width:${Math.abs(r.v)/m*100}%;background:${color(r)};height:14px;border-radius:4px"></div></div>
    <div style="width:74px;text-align:right" class="small"><b>${fmtV(r.v)}</b></div></div>`).join('')+`</div>`;
}
// ---------- meta + nav + seletor ----------
if(M.logo){const l=$('#logo');l.src=M.logo;l.style.display='block';}
$('#meta').textContent=`Escopo: fornecedor ${M.escopo} · ${M.n_itens} itens comparáveis · defasagem física +${M.offset} mês · mês parcial ${M.mes_parcial} fora dos cálculos`;
const TABS=[['visao','Visão geral'],['rankings','Maiores variações'],['ficha','Ficha do item'],
  ['mestre','Tabela mestre'],['lag','Acurácia por lag'],['estab','Estabilidade'],['excec','Exceções']];
TABS.forEach(([id,lb],i)=>{const a=el('a',{class:i===0?'active':''},lb);a.onclick=()=>{
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');
  document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));$('#'+id).classList.add('on');};
  $('#nav').append(a);});
const lagsel=$('#lagsel');
M.lags.forEach(o=>lagsel.append(el('option',{value:o.key},o.label)));
lagsel.value=CUR;
function setLagNote(){$('#lagnote').textContent =
  'janela: '+V().window.join(', ')+(isCons()?' · otimista (usa a última safra)':(CUR==='0'?' · mesmo mês (diagnóstico)':(CUR===String(M.lag)?' · leitura honesta':'')));}
lagsel.onchange=()=>{CUR=lagsel.value;renderDynamic();setLagNote();};

// merge metricas do view atual + dimensoes do item
const rowsMestre=()=>V().metrics.map(m=>Object.assign({},DIM[m.item]||{},m));
const metricOf=it=>V().metrics.find(m=>m.item===it);

// ---------- VISAO GERAL ----------
function renderVisao(){const s=$('#visao');s.innerHTML='';const a=V().agg,o=V().overview;
  const modo=isCons()?'consolidada (última safra — otimista)':(CUR==='0'?'lag 0 (mesmo mês — diagnóstico)':'lag '+CUR+(CUR===String(M.lag)?' (honesto)':''));
  s.append(el('h2',{},'Visão geral'),el('div',{class:'sub'},`Leitura ${modo} · janela ${o.meses.join(', ')}. Realizado = entrada física UPI (Qtd Delivered).`));
  const cards=el('div',{class:'cards'});
  const mk=(l,v,cls='')=>el('div',{class:'card'},el('div',{class:'lbl'},l),el('div',{class:'val '+cls},v));
  cards.append(mk('Acurácia (1−WAPE acum)',pct(a.acuracia)),mk('Bias de volume',pctS(a.bias),a.bias>=0?'pos':'neg'),
    mk('WAPE acum (volume)',pct(a.wape_acum)),mk('WAPE mês (com timing)',pct(a.wape_mes)));
  s.append(cards);
  const dica = isCons()
    ? `<b>Cuidado:</b> a leitura consolidada usa a previsão mais recente — informação que você não tinha na hora da compra. Ela achata o erro (otimista). Para cobrar acurácia, use o lag ${M.lag}.`
    : (CUR==='0'
      ? `<b>Diagnóstico:</b> o lag 0 é a previsão feita no próprio mês — a compra já estava travada há ~${M.lag} meses. Útil para ver o quanto a previsão melhora perto do alvo, mas não é a que dirigiu a compra.`
      : `A leitura honesta é o <b>lag ${M.lag}</b> (a previsão que travou a compra ~${M.lag} meses antes). O número de volume é a <b>WAPE acumulada</b>; a WAPE mês é inflada pelo timing de chegada (+${M.offset} mês).`);
  s.append(el('div',{class:'note',html:dica}));
  s.append(el('div',{class:'panel'},el('h3',{},'Previsto vs Recebido por mês (un.)'),
    el('div',{class:'legend',html:`<span><b style="background:${CF}"></b>Previsto (${isCons()?'consolidado':'lag '+CUR})</span><span><b style="background:${CA}"></b>Recebido</span><span class="small">rótulo = erro % do mês</span>`}),
    el('div',{html:barGroup(o.meses,[{name:'P',color:CF,values:o.F},{name:'R',color:CA,values:o.A}],{labelErr:o.err})})));
}

// ---------- RANKINGS ----------
function renderRankings(){const s=$('#rankings');s.innerHTML='';
  s.append(el('h2',{},'Maiores variações'),el('div',{class:'sub'},`Top 15 por variação absoluta (un.) e por variação % (piso: curvas A+B). Leitura atual: ${lagsel.options[lagsel.selectedIndex].text}.`));
  const R=V().rankings;
  const tbl=(rows,tipo)=>{const t=el('table');
    t.append(el('tr',{},...['Item','Descrição','ABC',tipo==='abs'?'Erro (un)':'Bias %','Prev','Receb'].map(h=>el('th',{class:h==='Item'||h==='Descrição'?'l':''},h))));
    (rows||[]).forEach(r=>{const d=DIM[r.item]||{};t.append(el('tr',{},
      el('td',{class:'l'},r.item),el('td',{class:'l',title:d.desc},(d.desc||'').slice(0,26)),
      el('td',{},el('span',{class:'chip b-abc'+r.abc},r.abc)),
      el('td',{},tipo==='abs'?fmt(r.erro_abs_un):pctS(r.bias)),
      el('td',{},fmt(r.F_lag)),el('td',{},fmt(r.A))));});
    return t;};
  const block=(title,rows,tipo)=>el('div',{class:'panel'},el('h3',{},title),el('div',{class:'scroll'},tbl(rows,tipo)));
  s.append(el('div',{class:'grid2'},
    block('Variação ABSOLUTA — superprevisão (prev > receb)',R.abs_over,'abs'),
    block('Variação ABSOLUTA — subprevisão (receb > prev)',R.abs_under,'abs'),
    block('Variação % — superprevisão (A+B)',R.pct_over,'pct'),
    block('Variação % — subprevisão (A+B)',R.pct_under,'pct')));
}

// ---------- FICHA DO ITEM ----------
let fichaItem=null;
function fichaSeries(item){const mtz=DATA.detalhe[item].matriz,win=V().window,out={meses:[],F:[],A:[]};
  win.forEach(t=>{const tj=mtz.targets.indexOf(t);if(tj<0)return;let F=null;
    if(isCons()){for(let vi=mtz.vintages.length-1;vi>=0;vi--){if(mtz.matrix[vi][tj]!=null){F=mtz.matrix[vi][tj];break;}}}
    else{const sa=mlabel(mkey(t)-(+CUR));const vi=mtz.vintages.indexOf(sa);F=vi>=0?mtz.matrix[vi][tj]:null;}
    out.meses.push(t);out.F.push(F||0);out.A.push(mtz.actual[tj]||0);});
  return out;}
function renderFicha(){const s=$('#ficha');s.innerHTML='';
  s.append(el('h2',{},'Ficha do item'),el('div',{class:'sub'},'Selecione qualquer item comparável (UPI). Métricas na leitura atual; a matriz e a acurácia por lag mostram todos os lags.'));
  const sorted=Object.keys(DIM).sort((a,b)=>(DIM[b].vol_recv||0)-(DIM[a].vol_recv||0));
  if(!fichaItem||!DIM[fichaItem])fichaItem=sorted[0];
  const sel=el('select',{style:'min-width:340px'});
  sorted.forEach(it=>sel.append(el('option',{value:it},`${it} · ${(DIM[it].desc||'').slice(0,34)} [${DIM[it].abc}]`)));
  sel.value=fichaItem;sel.onchange=()=>{fichaItem=sel.value;renderFicha();};
  const box=el('div');
  s.append(el('div',{class:'filters'},el('span',{class:'small'},'Item:'),sel),box);
  const it=fichaItem,d=DIM[it],m=metricOf(it),det=DATA.detalhe[it];
  box.append(el('div',{class:'panel'},
    el('h3',{html:`${it} — ${d.desc||''} <span class="chip b-abc${d.abc}">ABC ${d.abc}</span>${m?` <span class="cl cl-${m.classe}">${m.classe_label}</span>`:''}`}),
    el('div',{class:'small'},`Família: ${d.familia||'–'} · Marca: ${d.marca||'–'} · UM: ${d.um||'–'} · Status: ${d.status} · Churn: ${pct(d.churn)}`)));
  if(!m){box.append(el('div',{class:'note',html:`Este item não tem previsão nesta leitura (${lagsel.options[lagsel.selectedIndex].text}). Veja a matriz abaixo ou troque o lag.`}));}
  else{const cards=el('div',{class:'cards'});
    const mk=(l,v,cls='')=>el('div',{class:'card'},el('div',{class:'lbl'},l),el('div',{class:'val '+cls},v));
    cards.append(mk('Previsto',fmt(m.F_lag)),mk('Recebido',fmt(m.A)),mk('Bias',pctS(m.bias),m.bias>=0?'pos':'neg'),
      mk('WAPE acum',pct(m.wape_acum)),mk('Acurácia',pct(m.acuracia)),mk('Tracking signal',m.tracking_signal));
    box.append(cards);
    box.append(el('div',{class:'note',html:`<b>Padrão (${lagsel.options[lagsel.selectedIndex].text}):</b> ${m.classe_label}. <b>Ação:</b> ${m.acao}`}));
    const ser=fichaSeries(it);
    box.append(el('div',{class:'panel'},el('h3',{},`Previsto (${isCons()?'consolidado':'lag '+CUR}) vs Recebido — mês a mês`),
      el('div',{class:'legend',html:`<span><b style="background:${CF}"></b>Previsto</span><span><b style="background:${CA}"></b>Recebido</span>`}),
      el('div',{html:barGroup(ser.meses,[{name:'P',color:CF,values:ser.F},{name:'R',color:CA,values:ser.A}],
        {labelErr:ser.F.map((f,i)=>f?((ser.A[i]-f)/f*100):null)})})));
  }
  // matriz safra x alvo (todos os lags)
  const mtz=det.matriz,mt=el('table',{class:'matrix'});
  mt.append(el('tr',{},el('th',{class:'l'},'Safra ╲ Alvo'),...mtz.targets.map(t=>el('th',{},t))));
  const allv=mtz.matrix.flat().filter(x=>x!=null);const vmax=Math.max(1,...allv);
  mtz.vintages.forEach((v,vi)=>{const tr=el('tr',{},el('th',{class:'l'},v));
    mtz.matrix[vi].forEach(val=>{const bg=val==null?'#fff':`rgba(27,158,119,${0.08+0.5*val/vmax})`;
      tr.append(el('td',{style:`background:${bg}`},val==null?'':fmt(val)));});mt.append(tr);});
  const trR=el('tr',{class:'realizado'},el('th',{class:'l'},'Realizado'));
  mtz.actual.forEach(val=>trR.append(el('td',{style:'background:#fdece4'},val==null?'':fmt(val))));mt.append(trR);
  box.append(el('div',{class:'panel'},el('h3',{},'Matriz Safra × Mês-alvo (previsto) + Realizado'),
    el('div',{class:'small'},'Cada linha é uma safra; a intensidade da cor (teal) é o volume previsto. A última linha (laranja) é o recebido — dá para ver se o erro foi de volume ou de timing.'),
    el('div',{class:'scroll'},mt)));
  if(det.lag_acc.length){const rows=det.lag_acc.map(x=>({label:'lag '+x.lag,v:x.wape_acum==null?0:x.wape_acum*100}));
    box.append(el('div',{class:'panel'},el('h3',{},'Acurácia por lag deste item (WAPE acum %)'),
      el('div',{html:hbars(rows,{fmtV:v=>v.toFixed(0)+'%',color:r=>r.v>40?COVER:BRAND})})));}
}

// ---------- TABELA MESTRE ----------
let sortk='vol_recv',asc=false;
function renderMestre(){const s=$('#mestre');s.innerHTML='';
  s.append(el('h2',{},'Tabela mestre de itens'),el('div',{class:'sub'},`Todos os itens na leitura atual (${lagsel.options[lagsel.selectedIndex].text}). Clique no cabeçalho para ordenar; filtre e exporte.`));
  const cols=[['item','Item','l'],['desc','Descrição','l'],['familia','Família','l'],['abc','ABC',''],
    ['status','Status','l'],['classe_label','Padrão','l'],['vol_recv','Vol receb',''],['F_lag','Prev',''],
    ['A','Receb',''],['bias','Bias',''],['wape_acum','WAPE ac',''],['acuracia','Acur',''],
    ['tracking_signal','TS',''],['churn','Churn','']];
  const base=rowsMestre();
  const fFam=el('select',{},el('option',{value:''},'Família: todas'));
  [...new Set(base.map(r=>r.familia).filter(Boolean))].sort().forEach(f=>fFam.append(el('option',{value:f},f)));
  const fAbc=el('select',{},el('option',{value:''},'ABC: todos'),...['A','B','C'].map(x=>el('option',{value:x},'ABC '+x)));
  const fCl=el('select',{},el('option',{value:''},'Padrão: todos'));
  [...new Set(base.map(r=>r.classe_label))].forEach(c=>fCl.append(el('option',{value:c},c)));
  const q=el('input',{placeholder:'buscar item/descrição',style:'min-width:200px'});
  const exp=el('button',{},'Exportar CSV');const host=el('div',{class:'scroll'});const cnt=el('span',{class:'small muted'});
  let view=[];
  function apply(){view=base.filter(r=>
    (!fFam.value||r.familia===fFam.value)&&(!fAbc.value||r.abc===fAbc.value)&&
    (!fCl.value||r.classe_label===fCl.value)&&
    (!q.value||(r.item+' '+(r.desc||'')).toLowerCase().includes(q.value.toLowerCase())));
    view.sort((a,b)=>{let x=a[sortk],y=b[sortk];x=x==null?-1e18:x;y=y==null?-1e18:y;
      if(typeof x==='string')return asc?(''+x).localeCompare(y):(''+y).localeCompare(x);return asc?x-y:y-x;});
    const t=el('table');const hr=el('tr');
    cols.forEach(([k,l,cl])=>{const th=el('th',{class:cl},l+(sortk===k?(asc?' ▲':' ▼'):''));th.onclick=()=>{if(sortk===k)asc=!asc;else{sortk=k;asc=false;}apply();};hr.append(th);});
    t.append(hr);
    view.forEach(r=>{t.append(el('tr',{},
      el('td',{class:'l'},r.item),el('td',{class:'l',title:r.desc},(r.desc||'').slice(0,30)),
      el('td',{class:'l'},r.familia||''),el('td',{},el('span',{class:'chip b-abc'+r.abc},r.abc)),
      el('td',{class:'l'},r.status),el('td',{class:'l'},el('span',{class:'cl cl-'+r.classe},r.classe_label)),
      el('td',{},fmt(r.vol_recv)),el('td',{},fmt(r.F_lag)),el('td',{},fmt(r.A)),
      el('td',{},pctS(r.bias)),el('td',{},pct(r.wape_acum)),el('td',{},pct(r.acuracia)),
      el('td',{},r.tracking_signal),el('td',{},pct(r.churn))));});
    host.innerHTML='';host.append(t);cnt.textContent=view.length+' itens';}
  [fFam,fAbc,fCl].forEach(x=>x.onchange=apply);q.oninput=apply;
  exp.onclick=()=>{const head=cols.map(c=>c[1]).join(';');
    const body=view.map(r=>cols.map(c=>{let v=r[c[0]];return v==null?'':(''+v).replace(';',',');}).join(';')).join('\n');
    const blob=new Blob([head+'\n'+body],{type:'text/csv'});const u=URL.createObjectURL(blob);
    const link=el('a',{href:u,download:'mestre_itens_lag_'+CUR+'.csv'});link.click();URL.revokeObjectURL(u);};
  s.append(el('div',{class:'filters'},q,fFam,fAbc,fCl,exp,cnt),host);apply();
}

// ---------- ACURACIA POR LAG (independente do seletor) ----------
(function(){const s=$('#lag');
  s.append(el('h2',{},'Acurácia por lag (horizonte)'),el('div',{class:'sub'},'A partir de qual antecedência a previsão é confiável — cada lag na sua janela de meses fechados. (Compara todos os lags; independe do seletor acima.)'));
  const S=DATA.sensibilidade;
  s.append(el('div',{class:'panel'},el('h3',{},'WAPE por lag'),
    el('div',{class:'legend',html:`<span><b style="background:#c9c8c3"></b>WAPE mês</span><span><b style="background:${BRAND}"></b>WAPE acum (volume)</span>`}),
    el('div',{html:barGroup(S.map(x=>'lag '+x.lag),
      [{name:'mes',color:'#c9c8c3',values:S.map(x=>x.wape_mes*100)},
       {name:'acum',color:BRAND,values:S.map(x=>x.wape_acum*100)}],{fmtY:v=>v.toFixed(0)+'%'})})));
  const t=el('table');t.append(el('tr',{},...['Lag','Janela','Bias','WAPE mês','WAPE acum'].map((h,i)=>el('th',{class:i===1?'l':''},h))));
  S.forEach(x=>t.append(el('tr',{},el('td',{class:'l'},'lag '+x.lag),el('td',{class:'l small'},x.janela.join(', ')),
    el('td',{},pctS(x.bias)),el('td',{},pct(x.wape_mes)),el('td',{},pct(x.wape_acum)))));
  s.append(el('div',{class:'panel'},el('h3',{},'Detalhe'),t));
})();

// ---------- ESTABILIDADE (churn — independente do seletor) ----------
(function(){const s=$('#estab');
  s.append(el('h2',{},'Estabilidade do forecast (churn)'),el('div',{class:'sub'},'Quanto a previsão de um mesmo mês-alvo variou entre safras sucessivas. Alto churn = planejamento instável para a matriz.'));
  const arr=Object.entries(DIM).map(([it,d])=>({it,...d}));
  const top=arr.filter(r=>r.churn!=null).sort((a,b)=>b.churn-a.churn).slice(0,20);
  const mean=arr.reduce((a,r)=>a+(r.churn||0),0)/arr.length;
  s.append(el('div',{class:'cards'},el('div',{class:'card'},el('div',{class:'lbl'},'Churn médio'),el('div',{class:'val'},pct(mean)))));
  s.append(el('div',{class:'panel'},el('h3',{},'Top 20 itens por churn'),
    el('div',{html:hbars(top.map(r=>({label:r.it+' '+(r.desc||'').slice(0,16),v:r.churn*100})),{fmtV:v=>v.toFixed(0)+'%',color:r=>r.v>60?COVER:BRAND})})));
})();

// ---------- EXCECOES (TS segue o lag) ----------
function renderExcec(){const s=$('#excec');s.innerHTML='';
  s.append(el('h2',{},'Exceções'),el('div',{class:'sub'},`Órfãos, tracking signal fora de controle (leitura ${lagsel.options[lagsel.selectedIndex].text}) e itens novos/descontinuados.`));
  const ts=V().metrics.filter(r=>Math.abs(r.tracking_signal||0)>4).sort((a,b)=>Math.abs(b.tracking_signal)-Math.abs(a.tracking_signal));
  const arr=Object.entries(DIM).map(([it,d])=>({it,...d}));
  const novos=arr.filter(r=>r.status==='novo'),desc=arr.filter(r=>r.status==='descontinuado');
  const listPanel=(title,a,fn)=>el('div',{class:'panel'},el('h3',{},`${title} (${a.length})`),
    el('div',{class:'scroll',style:'max-height:260px'},el('div',{class:'small'},a.length?a.map(fn).join(' · '):'—')));
  s.append(el('div',{class:'grid2'},
    listPanel('Previsto e não recebido (UPI)',DATA.orfaos.previsto_nao_recebido,x=>x),
    listPanel('Recebido sem previsão',DATA.orfaos.recebido_sem_previsao,x=>x)));
  const t=el('table');t.append(el('tr',{},...['Item','Descrição','TS','Bias','Classe'].map((h,i)=>el('th',{class:i<2?'l':''},h))));
  ts.forEach(r=>{const d=DIM[r.item]||{};t.append(el('tr',{},el('td',{class:'l'},r.item),el('td',{class:'l'},(d.desc||'').slice(0,26)),
    el('td',{},r.tracking_signal),el('td',{},pctS(r.bias)),el('td',{},el('span',{class:'cl cl-'+r.classe},r.classe_label))));});
  s.append(el('div',{class:'panel'},el('h3',{},`Tracking signal fora de controle |TS|>4 (${ts.length})`),el('div',{class:'scroll'},t)));
  s.append(el('div',{class:'grid2'},
    listPanel('Itens novos (entraram no ano)',novos,r=>r.it),
    listPanel('Itens descontinuados (saíram)',desc,r=>r.it)));
}

// ---------- boot ----------
function renderDynamic(){renderVisao();renderRankings();renderFicha();renderMestre();renderExcec();}
renderDynamic();setLagNote();
</script>
